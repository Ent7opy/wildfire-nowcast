# Nixpacks config for the API service (root dir = repo root).
# Installs only api/ deps — ml/ is imported directly from the filesystem (not installed).

[phases.setup]
nixPkgs = ["python311", "curl"]

[phases.install]
cmds = [
    "curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh",
    "uv sync --project api --no-dev",
]
