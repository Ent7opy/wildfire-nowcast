name: CI

on:
  push:
    branches: [master, "pivot/**"]
  pull_request:
    branches: [master, "pivot/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - api
          - ml
          - ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync ${{ matrix.project }} dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync --dev

      - name: Ruff ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: uv run ruff check .

      - name: Pytest ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: uv run pytest -m "not integration"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

  nextjs:
    # Stage 1+ A' pivot Next.js app at the repo root.
    # Stage 0 introduced the scaffold; Stage 1 added Drizzle + AOI CRUD + tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests (PGlite)
        run: pnpm test

      - name: Build
        run: pnpm build
