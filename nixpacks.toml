# Nixpacks config for the ingest scheduler service (root dir = repo root).
# The API service uses root dir /api so it never reads this file.

[phases.setup]
# gdal: required by rasterio / rioxarray / dem-stitcher
# eccodes: required by cfgrib (GRIB weather data decoding)
nixPkgs = ["python311", "gdal", "eccodes", "curl"]

[phases.install]
cmds = [
    "curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh",
    "uv sync --project ingest --no-dev",
]
