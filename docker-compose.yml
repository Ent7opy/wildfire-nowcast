services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api:delegated
      - ./data:/app/data
      - ./ingest:/app/ingest:delegated
      - ./ml:/app/ml:delegated
      - ./models:/app/models
      - ./scripts:/app/scripts:delegated
      - /app/api/.venv
    environment:
      APP_ENV: dev
      GDAL_MEM_ENABLE_OPEN: "YES"
      WATCHFILES_FORCE_POLLING: "true"
      UVICORN_RELOAD_DIRS: /app/api
      # When running in Compose, other containers (e.g. UI) must reach TiTiler via service DNS,
      # not via localhost. However, the API generates URLs for the browser, so we set this to the
      # public URL. The UI will handle the internal resolution.
      TITILER_PUBLIC_BASE_URL: http://localhost:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-true}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-nominatim}
      GEOCODING_NOMINATIM_BASE_URL: ${GEOCODING_NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-wildfire-nowcast/0.1}
      GEOCODING_EMAIL: ${GEOCODING_EMAIL:-}
      GEOCODING_TIMEOUT_SECONDS: ${GEOCODING_TIMEOUT_SECONDS:-5}
      GEOCODING_MIN_INTERVAL_SECONDS: ${GEOCODING_MIN_INTERVAL_SECONDS:-1}
      GEOCODING_CACHE_TTL_HOURS: ${GEOCODING_CACHE_TTL_HOURS:-336}
      GEOCODING_CACHE_PRECISION: ${GEOCODING_CACHE_PRECISION:-2}
      GEOCODING_ZOOM: ${GEOCODING_ZOOM:-6}
      GEOCODING_ACCEPT_LANGUAGE: ${GEOCODING_ACCEPT_LANGUAGE:-en}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ui:
    build:
      context: ./ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui:delegated
      - /app/ui/node_modules
    environment:
      APP_ENV: dev
      VITE_API_BASE_URL: http://api:8000
      VITE_API_PUBLIC_BASE_URL: http://localhost:8000
      VITE_VECTOR_TILES_PUBLIC_BASE_URL: http://localhost:7800
      VITE_FORECAST_REGION_NAME: smoke_grid
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api

  db:
    image: imresamu/postgis:16-3.5
    shm_size: 256mb
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildfire}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./api
    command: alembic -c api/alembic.ini upgrade head
    volumes:
      - ./api:/app/api:delegated
    environment:
      APP_ENV: ${APP_ENV:-prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
    depends_on:
      db:
        condition: service_healthy

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports:
      - "8080:80"
    environment:
      - TITILER_CORS_ORIGIN=*
      # TiTiler needs to access the same data folder as api/ingest
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
    command: uv run rq worker
    volumes:
      - ./api:/app/api:delegated
      - ./data:/app/data
      - ./ingest:/app/ingest:delegated
      - ./ml:/app/ml:delegated
      - ./models:/app/models
      - ./scripts:/app/scripts:delegated
      - /app/api/.venv
    environment:
      APP_ENV: dev
      GDAL_MEM_ENABLE_OPEN: "YES"
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      DENOISER_ENABLED: ${DENOISER_ENABLED:-true}
      DENOISER_REQUIRED: ${DENOISER_REQUIRED:-false}
      DENOISER_MODEL_RUN_DIR: ${DENOISER_MODEL_RUN_DIR:-}
      DENOISER_PIPELINE_VERSION: ${DENOISER_PIPELINE_VERSION:-v2}
      DENOISER_THRESHOLD_PROFILE: ${DENOISER_THRESHOLD_PROFILE:-env}
      DENOISER_INVOKE_METHOD: ${DENOISER_INVOKE_METHOD:-python}
      DENOISER_PYTHON_EXECUTABLE: ${DENOISER_PYTHON_EXECUTABLE:-/app/.venv/bin/python3}
      DENOISER_ALLOW_UNSAFE_THRESHOLD_OVERRIDE: ${DENOISER_ALLOW_UNSAFE_THRESHOLD_OVERRIDE:-false}
      DENOISER_BATCH_SIZE: ${DENOISER_BATCH_SIZE:-5000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  ingest_scheduler:
    build:
      context: ./api
    command: >
      uv run --project ingest -m ingest.orchestrator
      --loop
      --jobs firms,weather,perimeters,lfmc,lulc,cleanup
      --enforce-freshness
      --max-retries 3
      --retry-backoff-seconds 20
      --firms-interval-minutes 30
      --weather-interval-minutes 60
      --weather-include-precip
      --perimeters-interval-minutes 1440
      --lfmc-interval-minutes 360
      --lulc-interval-minutes 10080
      --cleanup-interval-minutes 1440
      --dashboard-path /app/data/ingest/orchestrator_dashboard.json
    restart: unless-stopped
    volumes:
      - ./api:/app/api:delegated
      - ./data:/app/data
      - ./ingest:/app/ingest:delegated
      - ./ml:/app/ml:delegated
      - ./models:/app/models
      - ./scripts:/app/scripts:delegated
      - /app/api/.venv
    environment:
      APP_ENV: ${APP_ENV:-prod}
      # Denoiser: DENOISER_REQUIRED=false allows using a local model dir without registry promotion.
      # Set DENOISER_MODEL_RUN_DIR in .env to point at your model artifacts (path inside container).
      # Flip DENOISER_REQUIRED=true only after the model is promoted through model_registry.
      DENOISER_ENABLED: ${DENOISER_ENABLED:-true}
      DENOISER_REQUIRED: ${DENOISER_REQUIRED:-false}
      DENOISER_MODEL_RUN_DIR: ${DENOISER_MODEL_RUN_DIR:-}
      DENOISER_PIPELINE_VERSION: ${DENOISER_PIPELINE_VERSION:-v2}
      DENOISER_THRESHOLD_PROFILE: ${DENOISER_THRESHOLD_PROFILE:-env}
      DENOISER_INVOKE_METHOD: ${DENOISER_INVOKE_METHOD:-python}
      DENOISER_PYTHON_EXECUTABLE: ${DENOISER_PYTHON_EXECUTABLE:-/app/.venv/bin/python3}
      DENOISER_ALLOW_UNSAFE_THRESHOLD_OVERRIDE: ${DENOISER_ALLOW_UNSAFE_THRESHOLD_OVERRIDE:-false}
      DENOISER_BATCH_SIZE: ${DENOISER_BATCH_SIZE:-5000}
      # Bootstrap batches can reach ~10k rows (full day of VIIRS globally filtered to
      # FIRMS_INITIAL_LOOKBACK_MINUTES). 180s is not enough; 900s gives safe headroom.
      DENOISER_SUBPROCESS_TIMEOUT_SECONDS: ${DENOISER_SUBPROCESS_TIMEOUT_SECONDS:-900}
      # LFMC ecLand: set LFMC_ECLAND_API_URL to enable; LFMC_ECLAND_API_TOKEN is optional bearer.
      # If LFMC_ECLAND_API_URL is unset the job will fail gracefully without blocking FIRMS/weather.
      LFMC_ECLAND_API_URL: ${LFMC_ECLAND_API_URL:-}
      LFMC_ECLAND_API_TOKEN: ${LFMC_ECLAND_API_TOKEN:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      FIRMS_DAY_RANGE: ${FIRMS_DAY_RANGE:-1}
      FIRMS_INITIAL_LOOKBACK_MINUTES: ${FIRMS_INITIAL_LOOKBACK_MINUTES:-360}
      FIRMS_INCREMENTAL_LOOKBACK_MINUTES: ${FIRMS_INCREMENTAL_LOOKBACK_MINUTES:-30}
      FIRMS_WATERMARK_GRACE_MINUTES: ${FIRMS_WATERMARK_GRACE_MINUTES:-90}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/scripts/check_data_freshness.py"]
      interval: 30s
      timeout: 5s
      retries: 3

  tiles:
    image: pramsey/pg_tileserv:latest
    restart: unless-stopped
    ports:
      - "7800:7800"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-wildfire}:${POSTGRES_PASSWORD:-wildfire}@db:5432/${POSTGRES_DB:-wildfire}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
