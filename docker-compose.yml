services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api:delegated
      - ./data:/app/data
      - ./ingest:/app/ingest:delegated
      - ./ml:/app/ml:delegated
      - ./models:/app/models
      - ./scripts:/app/scripts:delegated
      - /app/api/.venv
    environment:
      APP_ENV: dev
      GDAL_MEM_ENABLE_OPEN: "YES"
      WATCHFILES_FORCE_POLLING: "true"
      UVICORN_RELOAD_DIRS: /app/api
      # When running in Compose, other containers (e.g. UI) must reach TiTiler via service DNS,
      # not via localhost. However, the API generates URLs for the browser, so we set this to the
      # public URL. The UI will handle the internal resolution.
      TITILER_PUBLIC_BASE_URL: http://localhost:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - db
      - redis

  ui:
    build:
      context: ./ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui:delegated
      - /app/ui/.venv
    environment:
      APP_ENV: dev
      API_BASE_URL: http://api:8000
      API_PUBLIC_BASE_URL: http://localhost:8000
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
    depends_on:
      - api

  db:
    image: imresamu/postgis:16-3.5
    shm_size: 256mb
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildfire}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports:
      - "8080:80"
    environment:
      - TITILER_CORS_ORIGIN=*
      # TiTiler needs to access the same data folder as api/ingest
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
    command: uv run rq worker
    volumes:
      - ./api:/app/api:delegated
      - ./data:/app/data
      - ./ingest:/app/ingest:delegated
      - ./ml:/app/ml:delegated
      - ./models:/app/models
      - ./scripts:/app/scripts:delegated
      - /app/api/.venv
    environment:
      APP_ENV: dev
      GDAL_MEM_ENABLE_OPEN: "YES"
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  ingest_scheduler:
    build:
      context: ./api
    command: >
      uv run --project ingest -m ingest.orchestrator
      --loop
      --jobs firms,perimeters
      --enforce-freshness
      --max-retries 3
      --retry-backoff-seconds 20
      --firms-interval-minutes 30
      --weather-interval-minutes 180
      --perimeters-interval-minutes 1440
      --dashboard-path /app/data/ingest/orchestrator_dashboard.json
    restart: unless-stopped
    volumes:
      - ./api:/app/api:delegated
      - ./data:/app/data
      - ./ingest:/app/ingest:delegated
      - ./ml:/app/ml:delegated
      - ./models:/app/models
      - ./scripts:/app/scripts:delegated
      - /app/api/.venv
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DENOISER_REQUIRED: "true"
      DENOISER_PIPELINE_VERSION: ${DENOISER_PIPELINE_VERSION:-v2}
      DENOISER_THRESHOLD_PROFILE: ${DENOISER_THRESHOLD_PROFILE:-strict_v1}
      DENOISER_ALLOW_UNSAFE_THRESHOLD_OVERRIDE: ${DENOISER_ALLOW_UNSAFE_THRESHOLD_OVERRIDE:-false}
      DENOISER_BATCH_SIZE: ${DENOISER_BATCH_SIZE:-5000}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/ingest/orchestrator_dashboard.json"]
      interval: 30s
      timeout: 5s
      retries: 3

  tiles:
    image: pramsey/pg_tileserv:latest
    restart: unless-stopped
    ports:
      - "7800:7800"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-wildfire}:${POSTGRES_PASSWORD:-wildfire}@db:5432/${POSTGRES_DB:-wildfire}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
