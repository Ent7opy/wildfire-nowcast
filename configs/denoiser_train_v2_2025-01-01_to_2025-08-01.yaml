seed: 42
model_output_root: models/denoiser_v2
snapshot_path: data/denoiser/snapshots_v2/full_2025-01-01_to_2025-08-01.parquet
label_column: event_label
slice_columns:
- sensor
- biome_slice
features:
- detection_count
- confidence_mean
- confidence_max
- frp_mean
- frp_max
- brightness_mean
- bright_t31_mean
- scan_mean
- track_mean
- landcover_mean
- persistence_mean
- weather_mean
- is_day_ratio
- duration_hours
- sin_doy
- cos_doy
model_backend: xgboost
model_params:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: 4
pos_class_weight: 2.0
pu_reliable_negative_max_prob: 0.15
global_calibration: platt
slice_calibration_min_samples: 50
isotonic_min_samples: 150
decision_threshold: 0.5
strong_filter_threshold: 0.5
downweight_threshold: 0.7
uncertainty_band_low: 0.45
uncertainty_band_high: 0.55
