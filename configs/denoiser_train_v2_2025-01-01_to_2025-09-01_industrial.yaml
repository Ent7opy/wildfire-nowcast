  unlabeled_multiplier: 4
  teacher_max_depth: 4
  teacher_colsample_bytree: 0.8
  pos_threshold: 0.7
  neg_threshold: 0.3
  min_oob_votes: 3
  pseudo_negative_max_ratio: 3.0
  max_pseudo_negative_rows: 0
  min_pseudo_positive_rows: 0
  oob_margin_min: 0.05
  spy_fraction: 0.15
  spy_min_rows: 30
  spy_pos_quantile: 0.65
  spy_neg_quantile: 0.1
sampling:
  enabled: true
  majority_ratio: 10.0
adasyn:
  enabled: true
  intensity_feature: frp_max
  high_intensity_quantile: 0.9
  multiplier: 2.0
  k_neighbors: 5
  min_high_intensity_rows: 10
  max_synthetic_rows: 20000
cross_validation:
  enabled: true
  folds: 3
  max_known_rows: 150000
global_calibration: platt
slice_calibration_min_samples: 50
isotonic_min_samples: 150
decision_threshold: 0.5
strong_filter_threshold: 0.5
downweight_threshold: 0.7
uncertainty_band_low: 0.45
uncertainty_band_high: 0.55
