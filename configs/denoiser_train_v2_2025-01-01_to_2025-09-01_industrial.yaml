model_backend: xgboost_pu_bagging
model_params:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: 4
pos_class_weight: 2.0
pu_reliable_negative_max_prob: 0.15
coverage_scope: covered
