# Champion vs challenger spread evaluation config

region_name: "smoke_grid"
bbox: [22.0, 40.0, 24.0, 42.0]
start_time: "2025-07-01T00:00:00+00:00"
end_time: "2025-08-31T23:59:59+00:00"

horizons_hours: [24, 48, 72]
min_detections: 10
interval_hours: 24
label_window_hours: 3
ece_bins: 10

champion:
  model_name: "HeuristicSpreadModelV0"
  model_params: {}

challenger:
  model_name: "LearnedSpreadModelV1"
  model_params:
    model_run_dir: "models/spread_v1/<run_id>"

# Conservative promotion gate
# Challenger is recommended only when primary metrics improve on all horizons
# and no major secondary regression exceeds these thresholds.
gate:
  bss_improvement_min: 0.03
  bss_horizon_floor: -0.005
  sal_regression_max: 0.05
  dm_pvalue_max: 0.05
  max_pr_auc_drop: 0.01
  max_iou_drop: 0.02

# Authoritative data-source declaration (required — absence triggers STOP-SRC-001 in gate).
# See docs/spread_data_sources.md §5 for accepted values and quality criteria.
data_sources:
  fires: "nasa_firms_viirs_nrt"
  weather: "noaa_gfs_025deg"
  terrain: "srtm30_dem_derived"
  fuels: "esa_worldcover_10m_ndvi+ecmwf_ecland_lfmc+nfdrs_dfmc"

plots:
  enabled: true
