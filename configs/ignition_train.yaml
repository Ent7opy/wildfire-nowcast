# Ignition probability model — training configuration.
#
# Usage:
#   make ignition-snapshot ARGS="--bbox -125 30 -100 50 --start 2025-06-01 --end 2025-09-30 --version v1"
#   make ignition-train CONFIG=configs/ignition_train.yaml
#
# Gate: model is promotable only when gate_report.json "pass": true
#   (requires calibrated AUC-ROC >= auc_roc_gate_threshold).

# ── Data ──────────────────────────────────────────────────────────────────────

# Path to snapshot directory (train.parquet + eval.parquet) or a single parquet.
snapshot_path: data/snapshots/ignition/v1

# Output directory for model artifacts.
out_root: models/ignition

# ── Features ─────────────────────────────────────────────────────────────────
# These must match the feature columns produced by ml.ignition.snapshot.

features:
  - fuel_moisture
  - lulc_flammability
  - relative_humidity
  - temperature_c
  - wind_speed_kmh
  - precip_last_7d_mm
  - drought_index
  - thunderstorm_active
  - days_since_last_burn

label_col: ignition_label

# ── Sampling ─────────────────────────────────────────────────────────────────

# Cap negatives at neg_pos_ratio × n_positive to manage class imbalance.
# Ignition events are rare (~0.1–1% of cells), so a ratio of 20 still gives
# good coverage while keeping training tractable.
neg_pos_ratio: 20

# Minimum number of positive (ignition) examples required for training.
# Raise an error if the snapshot has fewer than this.
min_positives: 50

# ── Calibration ──────────────────────────────────────────────────────────────

# "isotonic" (default) or "platt".
calibration_method: isotonic

# Fraction of training data held out for calibration fitting (latest rows).
calibration_holdout_fraction: 0.5

# ── Gate ─────────────────────────────────────────────────────────────────────

# gate_report.json "pass": true iff calibrated AUC-ROC >= this value.
# Model promotion is blocked when "pass": false.
auc_roc_gate_threshold: 0.65

# ── XGBoost hyperparameters ───────────────────────────────────────────────────

model_params:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  n_jobs: 4
  eval_metric: auc
  random_state: 42
  # scale_pos_weight is set automatically from class ratio at training time.
